services:
  api-python:
    build: .
    image: users-api-python
    ports:
      - "${PYTHON_PORT:-5000}:5000"
    volumes:
      - python-data:/data
    restart: unless-stopped

  api-go:
    build: ./go-server
    image: users-api-go
    ports:
      - "${GO_PORT:-5001}:5000"
    volumes:
      - go-data:/data
    restart: unless-stopped

volumes:
  python-data:
  go-data:
